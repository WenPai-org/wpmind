name: WPMind 测试

# 仓库自己的测试 workflow（wp-plugin-ci.yml 由 WenPai-org/ci-workflows 统一下发，这里不动它）。
#
# runner：linux-arm64 是 host 模式（fedora-runner），没有 job 容器，PHP/composer/node 由主机提供，
# 所以不用 setup-php。这台 runner 起不了 docker，e2e 用 wp-env 的 playground runtime（PHP wasm + SQLite）
# 加系统 chromium（写法参考 wpslug 的 wp-plugin-ci.yml）。playground 不支持 `wp-env run`，
# 用例改走 tests/E2E/mu-plugins/wpmind-e2e-reset.php 的测试专用 REST 端点复位状态。本地跑法见 tests/E2E/README.md。

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  unit:
    name: composer check
    runs-on: linux-arm64
    # Host runner is shared; a stuck phpcs/phpstan must not sit forever.
    timeout-minutes: 20
    env:
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链与 PHP 最低版本
        run: |
          php -v | head -1
          php -r 'exit(version_compare(PHP_VERSION, "8.1", ">=") ? 0 : 1);'
          composer --version

      - name: composer install（网络抖动重试 3 次）
        run: |
          for attempt in 1 2 3; do
            if composer install --no-interaction --no-progress --prefer-dist; then
              exit 0
            fi
            echo "composer install 失败（第 ${attempt} 次）"
            sleep $(( attempt * 10 ))
          done
          exit 1

      # Split former `composer check` so a hang shows which gate stalled (run 377
      # logged only through phpunit, then silence for 10m+ with no phpstan/audit line).
      - name: php-lint
        run: |
          echo "::group::composer lint"
          composer lint
          echo "::endgroup::"

      - name: phpunit
        run: |
          echo "::group::composer test"
          composer test
          echo "::endgroup::"

      - name: phpstan
        timeout-minutes: 5
        run: |
          echo "::group::composer analyze"
          composer analyze
          echo "::endgroup::"

      - name: phpcs baseline gate
        timeout-minutes: 5
        run: |
          echo "::group::composer cs"
          composer cs
          echo "::endgroup::"

      - name: composer audit（网络抖动重试 3 次）
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            echo "::group::composer audit attempt ${attempt}"
            if composer audit; then
              echo "::endgroup::"
              exit 0
            fi
            ec=$?
            echo "::endgroup::"
            echo "composer audit 失败（第 ${attempt} 次, exit=${ec}）"
            sleep $(( attempt * 10 ))
          done
          exit 1

      - name: 跑完后工作区必须干净
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo '测试在仓库里留下了改动：'
            git status --porcelain
            exit 1
          fi
          echo '工作区干净'

  e2e:
    name: Playwright e2e（wp-env playground）
    runs-on: linux-arm64
    needs: unit
    # 同一台 runner 上多个 PR/push 的 e2e 排队串行，兜住端口锁过期后的 stale GEO 读和登录态串用。
    concurrency:
      group: wpmind-e2e
      cancel-in-progress: false
    env:
      WP_CORE_TAG: '7.1.3'
      WP_CORE_SHA: 'fc9832bef919c2a08541248db23af90d14ffb082'
      # 和同一台 runner 上 wpslug 的 8888 错开。同一台 runner 会并发跑多个 e2e job，固定端口会互相抢，
      # 端口改由 tests/E2E/ci-port.sh 在这个范围里占用（WP_ENV_PORT/WP_BASE_URL 在那一步写入）.
      E2E_PORT_FIRST: '8946'
      E2E_PORT_LAST: '8949'
      # Host package puts the wrapper in /usr/bin (sbin path broke after runner re-register / package layout).
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /snap/bin/chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链
        run: |
          node --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>20||(a===20&&b>=10)?0:1)'
          npm --version
          jq --version
          if [ ! -x "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH}" ]; then
            for cand in /snap/bin/chromium /usr/bin/chromium-browser /usr/sbin/chromium-browser /usr/bin/chromium; do
              if [ -x "$cand" ]; then
                echo "chromium fallback: $cand"
                echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${cand}" >> "${GITHUB_ENV}"
                PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$cand
                break
              fi
            done
          fi
          test -x "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH}"
          "${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH}" --version || true

      - name: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund

      - name: 准备 WordPress core 和 wp-env 配置（core 固定到 tag + commit）
        run: |
          set -euo pipefail
          ASSET_DIR=$(mktemp -d /tmp/wpmind-wp-env.XXXXXX)
          CORE_DIR="${ASSET_DIR}/wordpress-core"
          git clone --quiet --depth=1 --branch "${WP_CORE_TAG}" \
            https://github.com/WordPress/WordPress.git "${CORE_DIR}"
          test "$(git -C "${CORE_DIR}" rev-parse HEAD)" = "${WP_CORE_SHA}"
          grep -Fq "\$wp_version = '${WP_CORE_TAG}';" "${CORE_DIR}/wp-includes/version.php"
          jq --arg core "${CORE_DIR}" --arg plugin "${PWD}" \
            '.core = $core | .plugins = [$plugin] | .mappings["wp-content/mu-plugins"] = ($plugin + "/tests/E2E/mu-plugins")' \
            .wp-env.json > "${ASSET_DIR}/wp-env.json"
          jq -e '.config.WPMIND_E2E_RESET == true' "${ASSET_DIR}/wp-env.json"
          echo "WPMIND_WP_ENV_CONFIG=${ASSET_DIR}/wp-env.json" >> "${GITHUB_ENV}"
          echo "WPMIND_WP_ENV_ASSETS=${ASSET_DIR}" >> "${GITHUB_ENV}"
          # 登录态文件按 job 分开，并发 job 不共用 /tmp 下同一个文件.
          echo "WPMIND_E2E_STORAGE_STATE=${ASSET_DIR}/admin-state.json" >> "${GITHUB_ENV}"

      - name: 占用一个空闲端口
        run: |
          set -euo pipefail
          PORT=$(tests/E2E/ci-port.sh claim)
          echo "e2e 端口：${PORT}"
          echo "WPMIND_E2E_PORT=${PORT}" >> "${GITHUB_ENV}"
          echo "WP_ENV_PORT=${PORT}" >> "${GITHUB_ENV}"
          echo "WP_BASE_URL=http://localhost:${PORT}" >> "${GITHUB_ENV}"

      - name: 启动 WordPress Playground
        run: npx wp-env start --runtime=playground --config "${WPMIND_WP_ENV_CONFIG}"

      - name: Playwright
        run: npx playwright test

      - name: 停止 WordPress Playground
        if: always()
        run: |
          if [ -n "${WPMIND_WP_ENV_CONFIG:-}" ]; then
            npx wp-env stop --runtime=playground --config "${WPMIND_WP_ENV_CONFIG}" || true
          fi

      - name: 释放端口
        if: always()
        run: tests/E2E/ci-port.sh release

      - name: 跑完后工作区必须干净
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'e2e 在仓库里留下了改动：'
            git status --porcelain
            exit 1
          fi
          echo '工作区干净'
